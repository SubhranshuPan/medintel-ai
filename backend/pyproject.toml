[project]
name = "medintel-backend"
version = "0.1.0"
description = "MedIntel AI backend — clinical intelligence platform API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "asyncpg>=0.30",
    "bcrypt>=4.1",
    "pyjwt>=2.10",
    "python-multipart>=0.0.9",
    "email-validator>=2.2",
    "pandas>=2.2",
    "pandera>=0.20",
    # Corpus ingestion (#61): E-utilities client, and a hardened XML parser.
    # stdlib ElementTree expands internal entities, so a malformed or hostile
    # response could exhaust memory before parsing fails — defusedxml refuses
    # entity expansion outright and costs one pure-Python module to add.
    "httpx>=0.27",
    "defusedxml>=0.7",
    # Vector store (#62, ADR-004). The embedded local mode runs the real
    # filtering implementation, so the payload-filter tests exercise Qdrant
    # rather than a stub.
    "qdrant-client>=1.12",
    # Knowledge extraction (#63, ADR-022). Strict tool use is what makes the
    # closed edge set enforceable by the API rather than by prompt wording;
    # the SDK is imported lazily so nothing else in the app depends on it.
    "anthropic>=0.40",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "aiosqlite>=0.20",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
# Alembic migration scripts are autogenerated; don't lint generated code.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "C4"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
